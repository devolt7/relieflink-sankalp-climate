<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />

  <!-- Hands / Heart / Cross Relief Symbol -->
  <g transform="translate(256, 256) scale(1.1)" filter="url(#shadow)">
    <!-- Location Pin Shape -->
    <path d="M 0 -110 C -60 -110 -100 -70 -100 -10 C -100 60 0 130 0 130 C 0 130 100 60 100 -10 C 100 -70 60 -110 0 -110 Z" fill="#ffffff" />
    <!-- Medical Cross inside Pin -->
    <path d="M -18 -45 H 18 V -22 H 41 V 14 H 18 V 37 H -18 V 14 H -41 V -22 H -18 Z" fill="#dc2626" />
  </g>
</svg>
