<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both getter and setter on Window and Window.prototype
      (function() {
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          var nativeFetch = win.fetch;
          var activeFetch = nativeFetch ? nativeFetch.bind(win) : undefined;

          function getActiveFetch() {
            return activeFetch;
          }
          function setActiveFetch(fn) {
            activeFetch = fn;
          }

          var targets = [];
          var p = win;
          while (p && p !== Object.prototype) {
            targets.push(p);
            p = Object.getPrototypeOf(p);
          }

          for (var i = 0; i < targets.length; i++) {
            try {
              var target = targets[i];
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc) {
                if (!desc.set || !desc.writable) {
                  Object.defineProperty(target, 'fetch', {
                    get: getActiveFetch,
                    set: setActiveFetch,
                    configurable: true,
                    enumerable: true
                  });
                }
              }
            } catch (err) {}
          }

          try {
            Object.defineProperty(win, 'fetch', {
              get: getActiveFetch,
              set: setActiveFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (outer) {}
      })();
    </script>
